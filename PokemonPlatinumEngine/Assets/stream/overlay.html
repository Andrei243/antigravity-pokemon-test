<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run overlay</title>
<!--
  The game's overlay for an OBS browser source (plan 13 · V24). Add a Browser source, tick "Local file" and choose this
  file: it sits beside state.json, which the game writes while the options' STREAM FEED row is on. It reads that one file
  and nothing else, opens no connection and sends nothing; the fields it uses are the ones docs/stream-feed.md lists.
  The background is transparent, so it lays over the game capture.
-->
<style>
  :root {
    --panel: rgba(18, 22, 40, 0.82);
    --rule: rgba(255, 255, 255, 0.16);
    --ink: #f4f6ff;
    --muted: #a9b2d6;
    --good: #5bd37a;
    --warn: #f2c14e;
    --bad: #ef5b5b;
    --gold: #f6d365;
  }
  html, body { margin: 0; background: transparent; color: var(--ink); font: 600 20px/1.3 "Nunito", "Segoe UI", system-ui, sans-serif; }
  #board { display: inline-flex; flex-direction: column; gap: 10px; padding: 14px; min-width: 320px; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 10px 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .place { font-size: 24px; font-weight: 900; }
  .muted { color: var(--muted); font-size: 16px; }
  .timer { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 900; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
  .mon { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 4px 0; }
  .mon + .mon { border-top: 1px solid var(--rule); }
  .bar { grid-column: 1 / 3; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--good); }
  .bar.mid > i { background: var(--warn); }
  .bar.low > i { background: var(--bad); }
  .fainted { opacity: 0.45; }
  .status { color: var(--warn); font-size: 14px; font-weight: 900; text-transform: uppercase; }
  .side + .side { border-top: 1px dashed var(--rule); margin-top: 6px; padding-top: 6px; }
  .grave { color: var(--muted); font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="board" hidden>
  <div class="panel">
    <div class="row"><span class="place" id="place"></span><span class="timer" id="timer" hidden></span></div>
    <div class="row"><div class="badges" id="badges"></div><span class="muted" id="last"></span></div>
    <div class="muted" id="rules"></div>
  </div>
  <div class="panel" id="party"></div>
  <div class="panel" id="battle" hidden></div>
  <div class="panel grave" id="grave" hidden></div>
</div>
<script>
"use strict";
const POLL_MS = 500;
const board = document.getElementById("board");
let state = null;
let readAt = 0;

function text(tag, cls, value) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  el.textContent = value;
  return el;
}

function name(mon) {
  return mon.nickname ? mon.nickname + " (" + mon.species + ")" : (mon.form || mon.species);
}

function monRow(mon) {
  const row = document.createElement("div");
  row.className = "mon" + (mon.hp <= 0 ? " fainted" : "");
  row.appendChild(text("span", "", name(mon) + "  Lv. " + mon.level));
  row.appendChild(text("span", mon.status === "None" ? "" : "status", mon.status === "None" ? mon.hp + "/" + mon.maxHp : mon.status));
  const bar = document.createElement("div");
  const share = mon.maxHp > 0 ? Math.max(0, Math.min(1, mon.hp / mon.maxHp)) : 0;
  bar.className = "bar" + (share <= 0.2 ? " low" : share <= 0.5 ? " mid" : "");
  const fill = document.createElement("i");
  fill.style.width = Math.round(share * 100) + "%";
  bar.appendChild(fill);
  row.appendChild(bar);
  return row;
}

function clock(seconds) {
  const whole = Math.floor(seconds);
  const h = Math.floor(whole / 3600), m = Math.floor(whole / 60) % 60, s = whole % 60;
  const pad = (n) => (n < 10 ? "0" : "") + n;
  return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
}

function draw() {
  if (!state) { board.hidden = true; return; }
  board.hidden = false;
  document.getElementById("place").textContent = state.place;
  const badges = document.getElementById("badges");
  badges.replaceChildren();
  for (const b of state.badges) { const dot = document.createElement("span"); dot.className = "badge"; dot.title = b; badges.appendChild(dot); }
  document.getElementById("rules").textContent = state.rules.on.length ? state.rules.preset + ": " + state.rules.on.join(", ") : "";

  const party = document.getElementById("party");
  party.replaceChildren();
  for (const mon of state.party) party.appendChild(monRow(mon));

  const battle = document.getElementById("battle");
  const fight = state.battle;
  battle.hidden = !fight;
  if (fight) {
    battle.replaceChildren();
    if (fight.foe) battle.appendChild(text("div", "muted", fight.foe));
    for (const side of [fight.player, fight.enemy]) {
      const box = document.createElement("div");
      box.className = "side";
      for (const mon of side) box.appendChild(monRow(mon));
      battle.appendChild(box);
    }
  }

  const grave = document.getElementById("grave");
  grave.hidden = state.graveyard.length === 0;
  grave.replaceChildren();
  for (const fallen of state.graveyard) grave.appendChild(text("div", "", name(fallen) + " Lv. " + fallen.level + " - " + fallen.place));

  const timer = state.timer;
  document.getElementById("timer").hidden = !timer;
  document.getElementById("last").textContent = timer && timer.last ? timer.last.name + " " + clock(timer.last.realSeconds) : "";
  tick();
}

// The timer runs between two writes: the file's seconds, plus what has passed since the file was read (until the run is finished)
function tick() {
  const timer = state && state.timer;
  if (!timer) return;
  const extra = timer.finished ? 0 : (Date.now() - readAt) / 1000;
  document.getElementById("timer").textContent = clock(timer.realSeconds + extra);
}

function poll() {
  const request = new XMLHttpRequest();
  request.open("GET", "state.json?" + Date.now());
  request.onload = () => {
    try {
      const next = JSON.parse(request.responseText);
      if (!state || next.updated !== state.updated || JSON.stringify(next) !== JSON.stringify(state)) {
        state = next;
        readAt = Date.now();
        draw();
      }
    } catch (e) { /* half a file is never written, but a missing one is just not there yet */ }
  };
  request.onerror = () => { /* the game is not writing: the last picture stays */ };
  request.send();
}

setInterval(poll, POLL_MS);
setInterval(tick, 250);
poll();
</script>
</body>
</html>
