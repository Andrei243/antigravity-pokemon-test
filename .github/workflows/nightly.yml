name: Nightly budgets

# Plan 16 · T10: the performance budgets every night under BUDGETS=strict, each median kept as a night's file on the
# `budgets` branch (nights/<date>.jsonl), and the night failed when an operation is more than 30 % over the month's
# median (tools/dev/budgets-month.sh). The harness's `budgets` mode (MapScene.Prepare, which needs a window) is the
# Windows machine's: a runner's software GL would time nothing worth keeping.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  budgets:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PokemonPlatinumTests -c Release

      - name: Budgets
        env:
          BUDGETS: strict
          BUDGETS_JSON: ${{ runner.temp }}/tonight.jsonl
        run: dotnet test PokemonPlatinumTests --no-build -c Release --filter "FullyQualifiedName~BudgetTests" --logger "console;verbosity=normal"

      - name: The month's nights
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/tonight.jsonl" ] || exit 0
          if git fetch origin budgets:budgets; then
            git worktree add "$RUNNER_TEMP/budgets" budgets
          else
            git worktree add --detach "$RUNNER_TEMP/budgets"
            git -C "$RUNNER_TEMP/budgets" checkout --orphan budgets
            git -C "$RUNNER_TEMP/budgets" rm -rfq .
          fi
          mkdir -p "$RUNNER_TEMP/budgets/nights"
          cp "$RUNNER_TEMP/tonight.jsonl" "$RUNNER_TEMP/budgets/nights/$(date -u +%Y-%m-%d).jsonl"

      - name: The 30 % rule
        run: bash tools/dev/budgets-month.sh "$RUNNER_TEMP/budgets/nights/$(date -u +%Y-%m-%d).jsonl" "$RUNNER_TEMP/budgets/nights"

      - name: Keep tonight
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/budgets/nights" ] || exit 0
          cd "$RUNNER_TEMP/budgets"
          git config user.name "nightly budgets"
          git config user.email "nightly@users.noreply.github.com"
          git add nights
          git commit -m "Budgets of $(date -u +%Y-%m-%d)" || exit 0
          git push origin budgets
