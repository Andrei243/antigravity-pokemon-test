<style>
:root { --bg: #f4f5f8; --card: #ffffff; --ink: #1b1b2b; --muted: #5d6070; --accent: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #16171d; --card: #ffffff; --ink: #e8e8ee; --muted: #a0a3b2; --accent: #ff8a7a; } }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 20px; color: var(--muted); max-width: 70ch; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
figure { margin: 0; background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
figure svg { display: block; width: 100%; height: auto; }
figcaption { padding: 8px 10px 10px; color: #1b1b2b; font-size: 13px; border-top: 1px solid #e6e7ee; }
.no { color: #5d6070; }
.ty { color: #5d6070; }
.star { margin-left: 6px; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #fde4e0; color: #a02a1e; }
</style>

<h1>Plan 03 · D14, batch 1 (Kanto): reference drawings</h1>
<p>Our own designs, drawn by hand as SVG from the written briefs of docs/plans/D14-proposals-kanto.md, as a reference for the 3D sculpts. They are not part of the game and are not shipped. 46 species, Nos. 2020 to 2146.</p>
