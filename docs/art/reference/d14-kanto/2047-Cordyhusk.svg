<style>.o{stroke:#1b1b2b;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}.t{stroke:#1b1b2b;stroke-width:3;fill:none;stroke-linecap:round}.r{fill:#d2483a}.rd{fill:#a8322a}.hu{fill:#efe4cc}.hus{fill:#cdbf9f}.gl{fill:#fff6c8}.th{stroke:#f4f2ec;stroke-width:4;fill:none;stroke-linecap:round}</style>
