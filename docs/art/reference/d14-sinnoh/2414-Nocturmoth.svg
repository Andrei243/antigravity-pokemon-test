<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Nocturmoth (No. 2414), reference drawing</title>
  <defs>
    <g id="wingUp">
      <path d="M0 0 C40 -60 120 -110 210 -96 C224 -40 190 20 110 40 C70 46 30 30 0 0 Z" fill="#e8892c"/>
      <path d="M20 4 C70 -30 140 -60 196 -60" fill="none" stroke="#7a4a24" stroke-width="8"/>
      <path d="M30 22 C80 0 140 -10 180 -14" fill="none" stroke="#7a4a24" stroke-width="8"/>
      <circle cx="150" cy="-50" r="22" fill="#f2d890"/>
      <circle cx="150" cy="-50" r="11" fill="#7a4a24" stroke="none"/>
      <circle cx="146" cy="-54" r="4" fill="#fff6d8" stroke="none"/>
    </g>
    <g id="wingDown">
      <path d="M0 0 C40 30 100 80 160 100 C180 70 170 30 120 10 C80 -4 40 -6 0 0 Z" fill="#c86a1e"/>
      <path d="M20 10 C60 30 110 60 150 80" fill="none" stroke="#7a4a24" stroke-width="7"/>
      <circle cx="120" cy="44" r="14" fill="#f2d890"/>
      <circle cx="120" cy="44" r="7" fill="#7a4a24" stroke="none"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>
  <ellipse cx="256" cy="480" rx="90" ry="11" fill="#e6e8ef"/>
  <g stroke="#1b1b2b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
