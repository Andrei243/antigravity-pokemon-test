    <use href="#leaf" transform="translate(166 168) rotate(-100) scale(0.75)" fill="#5aa64a"/>
    <!-- face (base) -->
    <ellipse cx="146" cy="214" rx="10" ry="14" fill="#6a4a2a" stroke="none"/>
    <ellipse cx="192" cy="214" rx="9" ry="13" fill="#6a4a2a" stroke="none"/>
    <circle cx="148" cy="208" r="4" fill="#ffffff" stroke="none"/>
    <circle cx="194" cy="208" r="4" fill="#ffffff" stroke="none"/>
    <path d="M162 238 L174 238 L168 244 Z" fill="#6a4a2a" stroke-width="2"/>
    <path d="M160 250 C164 254 172 254 176 250" fill="none" stroke-width="3"/>
    <path d="M126 176 C138 166 152 162 166 162" fill="none" stroke="#ffffff" stroke-width="5"/>
