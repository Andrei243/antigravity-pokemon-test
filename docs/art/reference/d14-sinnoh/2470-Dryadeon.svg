    <g id="bloom"><circle r="5" fill="#f2c230" stroke-width="2"/><circle cy="-8" r="5" fill="#ffffff" stroke-width="2"/><circle cx="8" r="5" fill="#ffffff" stroke-width="2"/><circle cy="8" r="5" fill="#ffffff" stroke-width="2"/><circle cx="-8" r="5" fill="#ffffff" stroke-width="2"/><circle r="4" fill="#f2c230" stroke="none"/></g>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>
  <ellipse cx="270" cy="458" rx="190" ry="16" fill="#e6e8ef"/>
