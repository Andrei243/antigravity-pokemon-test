    </g>
    <path d="M384 246 C390 220 398 196 410 180 M414 270 C430 256 446 248 462 246 M352 236 C346 214 340 196 330 184" fill="none" stroke="#3a7a30" stroke-width="3"/>
    <!-- far legs -->
    <path d="M222 350 L216 440 L244 440 L248 352 Z" fill="#d8c48a"/>
    <path d="M330 350 L340 436 L366 436 L352 344 Z" fill="#d8c48a"/>
    <!-- body (base) -->
    <path d="M190 300 C200 260 260 250 320 256 C370 262 390 296 380 336 C372 370 330 380 270 378 C220 376 182 344 190 300 Z" fill="#f4e4b0"/>
    <path d="M370 290 C390 330 372 366 330 378 C300 382 280 380 262 378 C320 366 360 340 370 290 Z" fill="#d8c48a" stroke="none"/>
    <!-- near legs (base) -->
    <path d="M206 350 L196 444 L230 444 L236 352 Z" fill="#f4e4b0"/>
    <path d="M310 356 L314 446 L346 446 L340 350 Z" fill="#f4e4b0"/>
    <path d="M190 446 C190 434 234 432 236 446 C236 456 190 458 190 446 Z" fill="#7a5a36"/>
    <path d="M308 448 C310 436 350 436 352 448 C352 458 308 458 308 448 Z" fill="#7a5a36"/>
