      <use href="#leaf" transform="translate(226 262) rotate(110) scale(1.2)"/>
      <use href="#leaf" transform="translate(236 258) rotate(70) scale(1.1)"/>
      <use href="#leaf" transform="translate(240 262) rotate(30) scale(1.1)"/>
    </g>
    <g fill="#5aa64a">
      <use href="#leaf" transform="translate(196 274) rotate(170)"/>
      <use href="#leaf" transform="translate(240 280) rotate(10)"/>
    </g>
    <use href="#bloom" transform="translate(246 304)"/>
    <use href="#bloom" transform="translate(300 266)"/>
    <use href="#bloom" transform="translate(186 300)"/>
    <!-- head (base) -->
    <path d="M110 220 C104 180 132 156 170 156 C208 156 236 180 232 220 C228 254 202 272 170 272 C138 272 114 254 110 220 Z" fill="#f4e4b0"/>
    <path d="M118 236 C130 260 156 270 184 268 C150 278 122 264 114 244 Z" fill="#d8c48a" stroke="none"/>
