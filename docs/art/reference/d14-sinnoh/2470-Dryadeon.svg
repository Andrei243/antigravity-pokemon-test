    <path d="M140 170 C110 130 100 80 112 30 C140 60 160 110 166 160 Z" fill="#d8c48a"/>
    <path d="M128 140 C120 110 118 80 122 56 C138 82 148 116 152 148 Z" fill="#5aa64a" stroke="none"/>
    <path d="M206 166 C226 120 254 80 296 56 C292 100 266 146 226 180 Z" fill="#d8c48a"/>
    <path d="M226 158 C244 124 262 100 284 82 C278 112 260 140 238 164 Z" fill="#5aa64a" stroke="none"/>
