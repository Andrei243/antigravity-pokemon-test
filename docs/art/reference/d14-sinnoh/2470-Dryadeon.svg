<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Dryadeon (No. 2470), reference drawing</title>
  <!-- base drawing shared with Borealeon (2471): same pose, body, legs and head -->
  <defs>
